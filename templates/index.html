<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIU CS Faculty Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1F3A;
    --navy-deep:#071527;
    --paper:#F5F0E1;
    --paper-card:#FBF8EF;
    --ink:#201D16;
    --gold:#C9A227;
    --gold-deep:#9C7B18;
    --slate:#5B6472;
    --rule:#D8CFB4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(11,31,58,0.05) 1px, transparent 1px);
    background-size:22px 22px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    background-image:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--paper-card);
    padding:56px 24px 40px;
    position:relative;
    overflow:hidden;
    border-bottom:6px solid var(--gold);
  }
  header::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      115deg,
      rgba(201,162,39,0.05) 0px,
      rgba(201,162,39,0.05) 1px,
      transparent 1px,
      transparent 64px
    );
    pointer-events:none;
  }
  .header-inner{
    max-width:1040px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before{
    content:"";
    width:22px;
    height:1px;
    background:var(--gold);
    display:inline-block;
  }
  h1{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:clamp(32px,5vw,52px);
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  header p.sub{
    font-family:'Spectral',serif;
    font-style:italic;
    font-size:17px;
    color:#C7CEDB;
    max-width:520px;
    margin:0 0 34px;
    line-height:1.5;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
  }

  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:13px 22px;
    border-radius:2px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--navy-deep);
    font-weight:500;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 6px 14px rgba(0,0,0,0.25); }
  .btn:focus-visible{ outline:2px solid #fff; outline-offset:3px; }
  .btn:disabled{ opacity:0.55; cursor:progress; transform:none; box-shadow:none; }
  .btn.ghost{
    background:transparent;
    color:var(--paper-card);
    border-color:rgba(255,255,255,0.35);
  }
  .btn.ghost:hover{ border-color:var(--gold); }

  .stamp-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--slate);
    display:inline-block;
  }
  .stamp-dot.live{ background:#5DBE7C; box-shadow:0 0 0 3px rgba(93,190,124,0.2); }

  input[type="search"]{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:13px 16px;
    border-radius:2px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06);
    color:var(--paper-card);
    min-width:220px;
  }
  input[type="search"]::placeholder{ color:#8792A5; }
  input[type="search"]:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Status bar ---------- */
  .status-bar{
    max-width:1040px;
    margin:0 auto;
    padding:18px 24px 0;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--slate);
  }
  .status-bar strong{ color:var(--ink); font-weight:600;}

  /* ---------- Main / Cards ---------- */
  main{
    max-width:1040px;
    margin:0 auto;
    padding:28px 24px 100px;
  }

  #state-panel{
    padding:60px 20px;
    text-align:center;
    font-family:'Spectral',serif;
    font-size:18px;
    color:var(--slate);
    border:1px dashed var(--rule);
    border-radius:3px;
    background:var(--paper-card);
  }
  #state-panel .icon{
    font-size:30px;
    display:block;
    margin-bottom:12px;
  }
  #state-panel .err-detail{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#9C3B3B;
    margin-top:10px;
  }

  .catalog{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:20px 20px 18px;
    position:relative;
    box-shadow:0 1px 0 rgba(11,31,58,0.04);
    animation:riseIn 0.35s ease both;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card::before{
    /* punch hole, card-catalog signature */
    content:"";
    position:absolute;
    top:14px; left:14px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--rule);
    box-shadow: 220px 0 0 -1px var(--paper), 220px 0 0 0 var(--rule);
  }
  .card{ padding-left:38px; }

  .card .name{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 6px;
    line-height:1.25;
    padding-bottom:10px;
    border-bottom:1px solid var(--rule);
  }
  .card .badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:2px;
    margin:10px 0 8px;
    color:#fff;
  }
  .badge.b-prof{ background:var(--navy); }
  .badge.b-assoc{ background:var(--gold-deep); }
  .badge.b-asst{ background:#6B7F5E; }
  .badge.b-lect{ background:var(--slate); }
  .badge.b-other{ background:#8A8073; }

  .card .title-line{
    font-size:13.5px;
    color:var(--ink);
    line-height:1.4;
    margin:0 0 10px;
  }
  .card .email{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--slate);
    word-break:break-all;
    text-decoration:none;
    border-bottom:1px dotted transparent;
  }
  .card .email:hover{ color:var(--navy); border-color:var(--navy); }

  .no-results{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    font-family:'Spectral',serif;
    font-style:italic;
    color:var(--slate);
  }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--slate);
    padding:0 24px 40px;
  }

  @media (max-width:520px){
    header{ padding:40px 18px 32px; }
    .controls{ flex-direction:column; align-items:stretch; }
    input[type="search"]{ min-width:0; }
    .status-bar{ padding:16px 18px 0; }
    main{ padding:24px 18px 80px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="eyebrow"><span class="stamp-dot" id="live-dot"></span> School of Computing &amp; Info. Sciences — FIU</div>
    <h1>Faculty Directory</h1>
    <p class="sub">A live index of the department roster, pulled directly from the FIU staff records on demand.</p>
    <div class="controls">
      <button class="btn" id="scrape-btn">Run scrape</button>
      <button class="btn ghost" id="export-btn" disabled>Export CSV</button>
      <input type="search" id="search-input" placeholder="Filter by name or title…" disabled aria-label="Filter faculty">
    </div>
  </div>
</header>

<div class="status-bar">
  <span id="status-text">No records loaded yet.</span>
  <span id="timestamp-text"></span>
</div>

<main>
  <div id="state-panel">
    <span class="icon">☙</span>
    Press <strong>Run scrape</strong> to pull the current faculty roster.
  </div>
  <div class="catalog" id="catalog" style="display:none;"></div>
</main>

<footer>FIU CIS Faculty Tool — data sourced live from cis.fiu.edu</footer>

<script>
  const scrapeBtn = document.getElementById('scrape-btn');
  const exportBtn = document.getElementById('export-btn');
  const searchInput = document.getElementById('search-input');
  const statePanel = document.getElementById('state-panel');
  const catalog = document.getElementById('catalog');
  const statusText = document.getElementById('status-text');
  const timestampText = document.getElementById('timestamp-text');
  const liveDot = document.getElementById('live-dot');

  let allProfessors = [];

  function badgeFor(title){
    const t = (title || '').toLowerCase();
    if (t.includes('associate')) return {cls:'b-assoc', label:'Associate Professor'};
    if (t.includes('assistant')) return {cls:'b-asst', label:'Assistant Professor'};
    if (t.includes('lecturer') || t.includes('instructor')) return {cls:'b-lect', label:'Lecturer'};
    if (t.includes('professor')) return {cls:'b-prof', label:'Professor'};
    return {cls:'b-other', label: title || 'Faculty'};
  }

  function renderCards(list){
    if (!list.length){
      catalog.innerHTML = '<div class="no-results">No entries match that search.</div>';
      return;
    }
    catalog.innerHTML = list.map(p => {
      const badge = badgeFor(p.Title);
      const emailHtml = p.Email
        ? `<a class="email" href="mailto:${p.Email}">${p.Email}</a>`
        : `<span class="email">—</span>`;
      return `
        <div class="card">
          <p class="name">${escapeHtml(p.Name || 'Unnamed')}</p>
          <span class="badge ${badge.cls}">${escapeHtml(badge.label)}</span>
          <p class="title-line">${escapeHtml(p.Title || '')}</p>
          ${emailHtml}
        </div>`;
    }).join('');
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function applyFilter(){
    const q = searchInput.value.trim().toLowerCase();
    if (!q){ renderCards(allProfessors); return; }
    const filtered = allProfessors.filter(p =>
      (p.Name || '').toLowerCase().includes(q) ||
      (p.Title || '').toLowerCase().includes(q)
    );
    renderCards(filtered);
  }

  function showState(html, isError){
    statePanel.style.display = 'block';
    catalog.style.display = 'none';
    statePanel.innerHTML = html;
    statePanel.style.borderColor = isError ? '#C77A7A' : '';
  }

  async function runScrape(){
    scrapeBtn.disabled = true;
    scrapeBtn.textContent = 'Scraping…';
    searchInput.disabled = true;
    exportBtn.disabled = true;
    liveDot.classList.remove('live');
    statusText.textContent = 'Contacting cis.fiu.edu…';
    showState('<span class="icon">◌</span> Reading the faculty roster…');

    try {
      const res = await fetch('/scrape');
      const data = await res.json();

      if (!data.success) throw new Error(data.error || 'Unknown error from server.');

      allProfessors = data.professors || [];
      allProfessors.sort((a,b) => (a.Name||'').localeCompare(b.Name||''));

      if (!allProfessors.length){
        showState('<span class="icon">☙</span> The scrape completed, but returned no entries.');
      } else {
        statePanel.style.display = 'none';
        catalog.style.display = 'grid';
        renderCards(allProfessors);
      }

      searchInput.disabled = false;
      exportBtn.disabled = false;
      liveDot.classList.add('live');
      statusText.innerHTML = `<strong>${allProfessors.length}</strong> faculty members on record`;
      timestampText.textContent = 'Last scraped ' + new Date().toLocaleString();

    } catch (err) {
      showState(`<span class="icon">✕</span> Could not complete the scrape.<div class="err-detail">${escapeHtml(err.message)}</div>`, true);
      statusText.textContent = 'Scrape failed.';
      timestampText.textContent = '';
    } finally {
      scrapeBtn.disabled = false;
      scrapeBtn.textContent = 'Run scrape';
    }
  }

  function exportCsv(){
    const rows = [['Name','Title','Email'], ...allProfessors.map(p => [p.Name||'', p.Title||'', p.Email||''])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'faculty_members.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  scrapeBtn.addEventListener('click', runScrape);
  exportBtn.addEventListener('click', exportCsv);
  searchInput.addEventListener('input', applyFilter);
</script>

</body>
</html>
